<!DOCTYPE html>
<html lang="uk">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel - WorkTracker</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>

<body>
    <div class="page-wrapper">
        <header class="header">
            <div class="container header-inner">
                <div class="logo">
                    <span class="logo-icon">🔐</span>
                    <span>Admin Panel</span>
                </div>
                <a href="stats.html" class="btn-back">
                    <i class="fas fa-arrow-left"></i> Назад
                </a>
            </div>
        </header>

        <main class="page-content">
            <div class="container">
                <!-- Форма входу -->
                <div class="glass-card" id="loginForm" style="max-width: 400px; margin: 0 auto;">
                    <h2 class="text-center">Введіть пароль</h2>
                    <form onsubmit="event.preventDefault(); login();">
                        <div class="form-group">
                            <input type="password" id="passwordInput" class="form-input" placeholder="Пароль адміна">
                        </div>
                        <button type="submit" class="btn btn-primary btn-block">
                            <i class="fas fa-sign-in-alt"></i> Увійти
                        </button>
                        <div id="loginError" class="text-error mt-2" style="display: none;"></div>
                    </form>
                </div>

                <!-- Контент адмін-панелі -->
                <div id="adminContent" style="display: none;">
                    <!-- Загальна статистика -->
                    <div class="stats-grid">
                        <div class="stat-card blue">
                            <div class="stat-icon">👥</div>
                            <div class="stat-number" id="totalWorkers">0</div>
                            <div class="stat-label">Всього працівників</div>
                        </div>
                        <div class="stat-card green">
                            <div class="stat-icon">🟢</div>
                            <div class="stat-number" id="activeToday">0</div>
                            <div class="stat-label">Активних зараз</div>
                        </div>
                        <div class="stat-card purple">
                            <div class="stat-icon">📋</div>
                            <div class="stat-number" id="monthShifts">0</div>
                            <div class="stat-label">Змін за місяць</div>
                        </div>
                        <div class="stat-card yellow">
                            <div class="stat-icon">⏱</div>
                            <div class="stat-number" id="totalHours">0</div>
                            <div class="stat-label">Всього годин</div>
                        </div>
                    </div>

                    <!-- Активні зміни -->
                    <div class="glass-card mb-3">
                        <div class="card-header">
                            <h3 class="card-title"><i class="fas fa-clock"></i> Активні зміни зараз</h3>
                        </div>
                        <div id="activeShifts" class="active-shifts-list">
                            <p class="text-muted">Завантаження...</p>
                        </div>
                    </div>

                    <!-- Топ працівників -->
                    <div class="glass-card mb-3">
                        <div class="card-header">
                            <h3 class="card-title"><i class="fas fa-trophy"></i> Топ працівників</h3>
                        </div>
                        <div id="topWorkers" class="top-workers-grid">
                            <p class="text-muted">Завантаження...</p>
                        </div>
                    </div>

                    <!-- Фільтри -->
                    <div class="glass-card mb-3">
                        <div class="filters-row">
                            <div class="filter-group">
                                <input type="text" id="searchInput" class="form-input" placeholder="Пошук за ім'ям..." oninput="filterWorkers()">
                            </div>
                            <div class="filter-group">
                                <select id="shiftFilter" class="form-select" onchange="filterWorkers()">
                                    <option value="all">Всі зміни</option>
                                    <option value="morning">Ранкові</option>
                                    <option value="evening">Вечірні</option>
                                </select>
                            </div>
                            <button class="btn btn-primary" onclick="exportCSV()">
                                <i class="fas fa-file-csv"></i> Експорт CSV
                            </button>
                        </div>
                    </div>

                    <!-- Таблиця працівників -->
                    <div class="glass-card">
                        <div class="card-header">
                            <h3 class="card-title"><i class="fas fa-users"></i> Всі працівники</h3>
                        </div>
                        <div class="table-wrapper">
                            <table>
                                <thead>
                                    <tr>
                                        <th>Ім'я</th>
                                        <th>Змін</th>
                                        <th>Ранкових</th>
                                        <th>Вечірніх</th>
                                        <th>Годин</th>
                                        <th>Середнє</th>
                                        <th>Роль</th>
                                    </tr>
                                </thead>
                                <tbody id="workersTable">
                                    <tr>
                                        <td colspan="7" class="text-center text-muted">Завантаження...</td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>
        </main>

        <div class="toast-container"></div>
    </div>

    <script src="js/config.js"></script>
    <script src="js/admin.js"></script>
</body>

</html>
